<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>干涉模擬</title>
</head>

<body>
    <canvas id="myCanvas" width="500" height="500"></canvas><br>
    X (-250~250): <input type="number" id="x" value="0">
    Y (-250~250): <input type="number" id="y" value="0">
    初相位(phi): <input type="number" id="phi" value="0">
    <button onclick="getInput()">新增</button>
    Z 距離: <input type="number" id="z_plane" value="100">
    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        const imageData = ctx.createImageData(width, height);
        const data = imageData.data;
        let dataArray = [];

        const lambda = 10;
        const fixedK = 2 * Math.PI / lambda;

        // 預設
        dataArray.push({ x: 0, y: 0, fi: 0 });

        function getInput() {
            const x = parseFloat(document.getElementById('x').value);
            const y = parseFloat(document.getElementById('y').value);
            const fi = parseFloat(document.getElementById('phi').value) * Math.PI;

            dataArray.push({ x: x, y: y, fi: fi });
            draw();
        }

        function draw() {
            const z_screen = parseFloat(document.getElementById('z_plane').value);

            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    const x = px - 250;
                    const y = py - 250;
                    const index = (py * width + px) * 4;

                    if (dataArray.length === 0) {
                        data[index] = 0; data[index+1] = 0; data[index+2] = 0; data[index+3] = 255;
                        continue;
                    }

                    let E_obj = 0;

                    dataArray.forEach(element => {
                        const distance = Math.sqrt((x - element.x) ** 2 + (y - element.y) ** 2 + z_screen ** 2);
                        E_obj += Math.sin(distance * fixedK + element.fi);
                    });
                    E_obj /= dataArray.length;

                    const gray = Math.floor((E_obj + 1) * 127.5);
                    const clampedGray = Math.max(0, Math.min(255, gray));

                    data[index] = clampedGray;      // R
                    data[index + 1] = clampedGray;  // G
                    data[index + 2] = clampedGray;  // B
                    data[index + 3] = 255;          // A
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        draw();
    </script>
</body>

</html>
